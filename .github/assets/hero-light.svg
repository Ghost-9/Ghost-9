  <rect x="74" y="226" width="64" height="4" rx="2" fill="url(#rule)"/>

  <text x="72" y="282"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif"
        font-size="21" font-weight="600" letter-spacing="3.4" fill="#5A6472">SOFTWARE ENGINEER</text>

  <text x="72" y="316"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif"
        font-size="19" font-weight="400" letter-spacing="0.2" fill="#78818E">Co-founder, Avartana Labs LLP</text>
</svg>
