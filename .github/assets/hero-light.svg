<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420" role="img" aria-label="Mayank Batra — Software engineer, Co-founder of Avartana Labs">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FCFCFD"/>
      <stop offset="1" stop-color="#F1F3F6"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1D4ED8"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="420" fill="url(#bg)"/>
  <rect x="0" y="0" width="1600" height="1" fill="#0B0E14" fill-opacity="0.07"/>

  <text x="1512" y="352" text-anchor="end"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif"
        font-size="300" font-weight="800" letter-spacing="-14"
        fill="#0B0E14" fill-opacity="0.05">MB</text>

  <text x="72" y="192"
